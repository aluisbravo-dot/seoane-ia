# Despliegue en Render (Blueprint). Las claves se ponen en el panel de Render, NO aquí.
services:
  - type: web
    name: seoanebot-ia
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/status
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: PROVIDER_ORDER
        value: groq
